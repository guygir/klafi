services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kalpi
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: kalpi
    ports:
      - "5432:5432"
    volumes:
      - klafi-pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalpi -d kalpi"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  klafi-pg:
